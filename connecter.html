<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentGig - Connexion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0716;
            background-image: 
                radial-gradient(at 20% 20%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 80% 80%, rgba(217, 70, 239, 0.15) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #ffffff;
        }

        .card {
            background: rgba(23, 15, 38, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(139, 92, 246, 0.2);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            color: #8b5cf6;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(139, 92, 246, 0.5);
        }

        .subtitle {
            text-align: center;
            color: #a78bfa;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #d8b4fe;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(139, 92, 246, 0.3);
            background: rgba(11, 7, 22, 0.8);
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #d946ef;
            box-shadow: 0 0 10px rgba(217, 70, 239, 0.4);
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #8b5cf6, #d946ef);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(217, 70, 239, 0.4);
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #9ca3af;
        }

        .footer-text a {
            color: #d8b4fe;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">StudentGig ⚡</div>
        <div class="subtitle">Connexion à votre espace</div>

        <div id="errorAlert" class="error-msg">
            Email ou mot de passe incorrect !
        </div>

        <form id="loginForm" action="login_process.php" method="POST">
            <div class="form-group">
                <label for="email">Adresse Email</label>
                <input type="email" id="email" placeholder="étudiant@faculte.tn" required>
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit">Se Connecter 🚀</button>
        </form>

        <div class="footer-text">
            Vous n'avez pas de compte ? <a href="inscri.html">S'inscrire</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Man3 el rafraîchissement
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorAlert = document.getElementById('errorAlert');

            // Simulation t-thabbet (Tnajem t-badalha ki t-hott base de données maba3d)
            // Houni n-tistiw iza el email fih "admin" wela 7atta ay email mri9el
            if(email && password.length >= 4) {
                errorAlert.style.display = 'none';
                // Redirection lel page d'accueil (index.html)
                window.location.href = "projet4.html";
            } else {
                // Iza el data ghalta, y-tala3 message d'erreur
                errorAlert.style.display = 'block';
            }
        });
    </script>

</body>
</html>

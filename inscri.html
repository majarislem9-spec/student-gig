<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentGig - Inscription</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0716;
            background-image: 
                radial-gradient(at 20% 20%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 80% 80%, rgba(217, 70, 239, 0.15) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #ffffff;
        }

        .card {
            background: rgba(23, 15, 38, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(139, 92, 246, 0.2);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            color: #8b5cf6;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(139, 92, 246, 0.5);
        }

        .subtitle {
            text-align: center;
            color: #a78bfa;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #d8b4fe;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(139, 92, 246, 0.3);
            background: rgba(11, 7, 22, 0.8);
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            border-color: #d946ef;
            box-shadow: 0 0 10px rgba(217, 70, 239, 0.4);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #8b5cf6, #d946ef);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(217, 70, 239, 0.4);
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #9ca3af;
        }

        .footer-text a {
            color: #d8b4fe;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">StudentGig ⚡</div>
        <div class="subtitle">Créer votre compte étudiant ou recruteur</div>

        <form id="signupForm" action="register_process.php" method="POST">
            <div class="form-group">
                <label for="fullname">Nom & Prénom</label>
                <input type="text" id="fullname" placeholder="Ex: Salma Mansour" required>
            </div>

            <div class="form-group">
                <label for="email">Adresse Email</label>
                <input type="email" id="email" placeholder="étudiant@faculte.tn" required>
            </div>

            <div class="form-group">
                <label for="role">Vous êtes ?</label>
                <select id="role">
                    <option value="student">Étudiant (À la recherche d'un Job)</option>
                    <option value="recruiter">Recruteur / Commerce Local</option>
                </select>
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit">S'inscrire en 1 Clic 🚀</button>
        </form>

        <div class="footer-text">
            Vous avez déjà un compte ? <a href="connecter.html">Se connecter</a>
        </div>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Empêcher le rechargement de la page
            
            // Enregistrement de la simulation (Optionnel)
            const fullname = document.getElementById('fullname').value;
            localStorage.setItem('student_user', fullname);

            // Redirection vers la page d'accueil du site
            window.location.href = "projet4.html"; 
        });
    </script>

</body>
</html>
